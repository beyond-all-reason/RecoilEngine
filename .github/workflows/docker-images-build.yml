# Builds docker images used by engine-build.yml
name: Docker Images Build
on:
  workflow_dispatch:
    inputs:
      update-digests:
        description: "Commit new image versions to branch"
        type: boolean
        default: true
  push:
    branches:
      - master
    paths:
      - 'docker-build-v2/images/**'
  pull_request:
    paths:
      - 'docker-build-v2/images/**'
jobs:
  build-images:
    if: github.repository == 'beyond-all-reason/RecoilEngine' || github.event_name == 'workflow_dispatch'
    name: Build ${{ matrix.system.target }} docker image
    runs-on: ${{ matrix.system.runs-on }}
    strategy:
      matrix:
        system:
          - target: amd64-linux
            runs-on: ubuntu-24.04
          - target: arm64-linux
            runs-on: ubuntu-24.04-arm
          - target: amd64-windows
            runs-on: ubuntu-24.04
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        run: |
          docker-build-v2/images/${{ matrix.system.target }}/build.sh \
            --no-cache \
            -t ghcr.io/${{ github.repository_owner }}/recoil-build-${{ matrix.system.target }}:latest
      - name: Push image
        id: push
        if: github.event_name != 'pull_request'
        run: |
          output=$(docker push ghcr.io/${{ github.repository_owner }}/recoil-build-${{ matrix.system.target }}:latest)
          echo "$output"
          digest=$(echo "$output" | grep -oP 'digest: \Ksha256:[a-f0-9]+')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Write new image digest to file
        if: github.event_name != 'pull_request'
        run: echo "${{ steps.push.outputs.digest }}" > ${{ matrix.system.target }}.txt
      - name: Save digest in artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: image-digest-${{ matrix.system.target }}
          path: ${{ matrix.system.target }}.txt
  gather-digests:
    name: Gather digests
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    needs: build-images
    outputs:
      images_versions: ${{ steps.merge.outputs.images_versions }}
    steps:
      - name: Fetch digests
        uses: actions/download-artifact@v7
        with:
          path: .digests
          pattern: image-digest-*
          merge-multiple: true
      - name: Merge digests
        id: merge
        run: |
          echo "images_versions=$(
            for digest in $(ls .digests); do
              echo "${digest%.*}=$(cat .digests/$digest)"
            done | jq -Rnc '[inputs] | map(. | split("=") | {key: .[0], value: .[1]}) | from_entries'
          )" >> "$GITHUB_OUTPUT"
  test-build:
    needs: gather-digests
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/engine-build.yml
    with:
      image-versions: ${{ needs.gather-digests.outputs.images_versions }}
    secrets: inherit
  publish:
    name: Update digest branch
    needs: [test-build, gather-digests]
    if: github.event_name == 'workflow_dispatch' && inputs.update-digests == true || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Update digests
        env:
          images_versions: ${{ needs.gather-digests.outputs.images_versions }}
        run: |
          echo "$images_versions" | jq -r 'to_entries[] | "\(.key) \(.value)"' | while read -r platform digest; do
            sed -i -r "s/(image_version\[$platform\]=)(.*)/\1$digest/" docker-build-v2/images_versions.sh
          done
      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Automatic docker build image update from ${{ github.sha }}
