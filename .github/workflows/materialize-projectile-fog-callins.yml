name: Limit Projectile Fog Callins To LuaUI

on:
  workflow_dispatch:
  push:
    branches:
      - agent/projectile-fog-callins
    paths:
      - ".github/workflows/materialize-projectile-fog-callins.yml"

permissions:
  contents: write

jobs:
  limit-routing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/projectile-fog-callins
          fetch-depth: 0
          submodules: false

      - name: Restore LuaGadgets handlers from master
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git checkout origin/master -- \
            cont/base/springcontent/LuaGadgets/callins.lua \
            cont/base/springcontent/LuaGadgets/gadgets.lua

      - name: Validate LuaUI-only routing
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -n "function widgetHandler:DrawWorldPreProjectiles" cont/LuaUI/widgets.lua
          grep -n "function widgetHandler:DrawWorldPreAlpha" cont/LuaUI/widgets.lua
          if grep -q "DrawWorldPreProjectiles" cont/base/springcontent/LuaGadgets/callins.lua; then
            echo "Unexpected LuaGadgets callin registration remains" >&2
            exit 1
          fi
          if grep -q "function gadgetHandler:DrawWorldPreProjectiles" cont/base/springcontent/LuaGadgets/gadgets.lua; then
            echo "Unexpected GadgetHandler dispatcher remains" >&2
            exit 1
          fi
          git diff --stat

      - name: Commit LuaGadgets revert
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cont/base/springcontent/LuaGadgets/callins.lua cont/base/springcontent/LuaGadgets/gadgets.lua
          git commit -m "keep new draw callins scoped to LuaUI"
          git push origin HEAD:agent/projectile-fog-callins
