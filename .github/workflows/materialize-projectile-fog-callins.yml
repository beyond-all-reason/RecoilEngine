name: Materialize Projectile Fog Callins

on:
  workflow_dispatch:
  push:
    branches:
      - agent/projectile-fog-callins
    paths:
      - ".github/workflows/materialize-projectile-fog-callins.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/projectile-fog-callins
          fetch-depth: 0
          submodules: false

      - name: Apply validated callin patch to sources
        shell: bash
        run: |
          set -euo pipefail
          python3 projectile-fog-callins/apply_patch.py
          git diff --check

      - name: Remove temporary patch machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -rf projectile-fog-callins
          git diff --check
          git status --short

      - name: Commit materialized sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "add pre-projectile and pre-alpha draw callins"
          git push origin HEAD:agent/projectile-fog-callins
